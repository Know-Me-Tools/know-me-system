<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 805" role="img" aria-label="Live media and durable control stay distinct."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c8431f"/></marker></defs><rect width="1000" height="805" rx="14" fill="#f7f8fb"/><text x="30" y="42" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#15025d">Live media and durable control stay distinct.</text><rect x="30.0" y="75" width="940.0" height="95" rx="10" fill="#ede8f7" stroke="#c5cbd5"/><text x="48.0" y="107" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15025d">People + native clients</text><text x="48.0" y="133" font-family="Arial,sans-serif" font-size="16" fill="#374151">Microphone / camera / audio route / visible consent</text><path d="M500 172V203" stroke="#c8431f" stroke-width="2" marker-end="url(#arrow)"/><rect x="30.0" y="205" width="940.0" height="95" rx="10" fill="#fff0e8" stroke="#c5cbd5"/><text x="48.0" y="237" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15025d">LiveKit media plane</text><text x="48.0" y="263" font-family="Arial,sans-serif" font-size="16" fill="#374151">Rooms / participants / tracks / data hints</text><path d="M500 302V333" stroke="#c8431f" stroke-width="2" marker-end="url(#arrow)"/><rect x="30.0" y="335" width="940.0" height="95" rx="10" fill="#e5eff2" stroke="#c5cbd5"/><text x="48.0" y="367" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15025d">Agents coordinator</text><text x="48.0" y="393" font-family="Arial,sans-serif" font-size="16" fill="#374151">Owner binding / turn authority / speech floor / vision gate</text><path d="M500 432V463" stroke="#c8431f" stroke-width="2" marker-end="url(#arrow)"/><rect x="30.0" y="465" width="940.0" height="95" rx="10" fill="#e7efe8" stroke="#c5cbd5"/><text x="48.0" y="497" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15025d">Rust control plane</text><text x="48.0" y="523" font-family="Arial,sans-serif" font-size="16" fill="#374151">Room epoch / dispatch lease / grants / consent / budgets</text><path d="M500 562V593" stroke="#c8431f" stroke-width="2" marker-end="url(#arrow)"/><rect x="30.0" y="595" width="940.0" height="95" rx="10" fill="#ede8f7" stroke="#c5cbd5"/><text x="48.0" y="627" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#15025d">Effect store + outbox</text><text x="48.0" y="653" font-family="Arial,sans-serif" font-size="16" fill="#374151">Tool approvals / idempotency / outcomes / reconciliation</text><text x="30" y="780" font-family="Arial,sans-serif" font-size="17" fill="#4b5563">An AI endpoint sees plaintext it processes. Private sidecars require a separate audience.</text></svg>