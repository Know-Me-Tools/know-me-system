name: knowme_poc
description: "knowme-poc — Hybrid mobile application (Prometheus AGS / TJ-ARCH-MOB-001)"
publish_to: none
version: 1.0.0+1

environment:
  # Flutter 3.47.0-0.1.pre ships Dart 3.13.0-282.1.beta. Include the
  # prerelease floor while keeping 3.13 as the supported minimum line.
  sdk: ">=3.13.0-0 <4.0.0"
  flutter: ">=3.47.0-0.1.pre"

dependencies:
  flutter:
    sdk: flutter

  # ── Shared Prometheus packages (published to pub.dev; path deps in-repo) ──
  gen_ui_flutter:
    path: ../flutter_packages/gen_ui_flutter
  gen_ui_widgets:
    path: ../flutter_packages/gen_ui_widgets
  prometheus_entity_management:
    path: ../flutter_packages/prometheus_entity_management

  # ── State management (Riverpod 3) ────────────────────────────────────────
  flutter_riverpod: 3.3.1
  riverpod_annotation: 4.0.2
  riverpod_sqflite: 0.4.2      # offline provider-cache persistence (latest compatible generated-code set)

  # ── Models ───────────────────────────────────────────────────────────────
  freezed_annotation: ^3.1.0
  json_annotation: 4.11.0

  # ── FFI bridge ───────────────────────────────────────────────────────────
  flutter_rust_bridge: 2.13.0-beta.5

  # ── UI components (shadcn/ui equivalent) ─────────────────────────────────
  shadcn_flutter: ^0.0.53

  # ── Navigation ───────────────────────────────────────────────────────────
  go_router: ^17.3.0

  # ── Markdown + code highlighting ─────────────────────────────────────────
  markdown_widget: ^2.3.2+8
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0

  # ── Typography / motion ──────────────────────────────────────────────────
  google_fonts: ^8.2.0
  flutter_animate: ^4.5.2

  # ── Storage / auth ───────────────────────────────────────────────────────
  flutter_secure_storage: ^10.3.1
  supabase_flutter: ^2.16.0

  # ── Utilities ────────────────────────────────────────────────────────────
  gap: ^3.0.1
  uuid: ^4.6.0
  intl: ^0.20.3
  path_provider: ^2.1.6
  collection: ^1.19.1
  # 11.0.2 skips its Kotlin plugin under AGP 9 but still registers a Kotlin
  # class, producing a missing FilePickerPlugin Java compile error. 12.0.0-beta.7
  # also removes the current FilePicker.platform API used by the app.
  file_picker: 10.3.8
  gen_ui_ffi:
    path: rust_builder

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: 3.2.5
  json_serializable: 6.13.0
  riverpod_generator: 4.0.3
  alchemist: ^0.14.0           # deterministic golden tests (VGV workflow) — no mocks

flutter:
  uses-material-design: true
