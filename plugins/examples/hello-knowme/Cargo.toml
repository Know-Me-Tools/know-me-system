# Standalone component crate — intentionally NOT a member of the rust/ workspace
# (it targets wasm32-wasip2 and builds with its own profile).
[package]
name = "hello-knowme"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
# Generates the guest bindings for knowme:plugin@0.1.0 from the WIT file.
wit-bindgen = "0.36"

[profile.release]
opt-level = "s"
lto = true
