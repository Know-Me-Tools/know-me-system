[package]
name = "gen_ui_inference"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Desktop local-inference lane (mistral.rs, Metal). OFF by default so surfaces that
# don't want a 17-crate inference workspace in their graph stay cheap to compile —
# tauri-plugin-gen-ui opts in explicitly. Named `local-mistral` rather than a bare
# `mistral` to leave room for the sibling lanes in versions.toml [inference]:
# llama-cpp-2 on mobile, WebLLM on web.
default = []
local-mistral = ["dep:mistralrs"]
local-llama = ["dep:llama-cpp-2", "dep:reqwest", "dep:sha2", "dep:encoding_rs", "llama-cpp-2/llguidance"]
local-llama-metal = ["local-llama", "llama-cpp-2/metal"]
local-llama-opencl = ["local-llama", "llama-cpp-2/opencl"]
local-llama-mtmd = ["local-llama", "llama-cpp-2/mtmd", "llama-cpp-2/common"]
local-litert-lm = ["dep:reqwest", "dep:sha2", "dep:encoding_rs"]
# iOS MLX-Swift lane. Rust owns catalog/download/verify/preflight; a Swift
# bridge (registered at app launch) binds MLX generation. No Rust ML crate —
# inference lives entirely on the Swift side — so this is host-compilable and
# unit-tested with a mock bridge.
local-mlx = ["dep:reqwest", "dep:sha2"]

[dependencies]
gen_ui_types   = { path = "../gen_ui_types" }
gen_ui_runtime = { path = "../gen_ui_runtime" }
async-trait.workspace = true
anyhow.workspace = true
futures.workspace = true
tracing.workspace = true
serde_json.workspace = true
serde.workspace = true
# `sync` for the RwLock guarding the loaded model + the mpsc channel that carries
# generated tokens out of the spawned generation task.
tokio = { workspace = true, features = ["sync", "fs", "io-util"] }
# UnboundedReceiverStream — adapts that channel's receiver into the futures::Stream
# the InferenceProvider trait returns.
tokio-stream.workspace = true
llama-cpp-2 = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
encoding_rs = { workspace = true, optional = true }

# mistral.rs is desktop-only: no documented mobile deployment path
# (gen_ui_types::inference §rationale) and it does not build for wasm32.
# Target-gating here — rather than relying on the feature alone — means an
# accidental `--features local-mistral` on an iOS/Android/wasm build resolves to
# nothing instead of dragging in (or failing on) the whole candle/Metal graph.
[target.'cfg(not(any(target_os = "ios", target_os = "android", target_arch = "wasm32")))'.dependencies]
mistralrs = { workspace = true, optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni.workspace = true

# sysctl(hw.memsize) for the iOS jetsam preflight — an over-budget model load
# kills the process outright, so the size gate has to run before the load rather
# than catching a failure after it.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"
