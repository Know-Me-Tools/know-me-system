frf-ports = { git = "ssh://git@github.com/Prometheus-AGS/flint-realtime-fabric", rev = "f67f93e4520fa1775851441c1178a7c4a06e7ae3" }
frf-store-redb = { git = "ssh://git@github.com/Prometheus-AGS/flint-realtime-fabric", rev = "f67f93e4520fa1775851441c1178a7c4a06e7ae3" }
frf-crdt = { git = "ssh://git@github.com/Prometheus-AGS/flint-realtime-fabric", rev = "f67f93e4520fa1775851441c1178a7c4a06e7ae3" }
