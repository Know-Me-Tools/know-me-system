[package]
name = "knowme_ofp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OFP personal-class peer sync with durable consent and mutual QUIC admission"

[dependencies]
# gen_ui_types::sync / gen_ui_db_graph become dependencies when transport + CRDT merge land (roadmap M2).
workspace-hack = { path = "../workspace-hack" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait.workspace = true
sha2.workspace = true
loro = "1.13.1"
tokio = { workspace = true, features = ["fs", "io-util", "sync", "time"] }
