[package]
name = "knowme_plugin_host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "WASM plugin host — knowme:plugin@1.0.0 WIT contract (wit/v1/, see wit/MIGRATION.md for the superseded 0.1.0 dialect), IPFS-addressed manifests, Ed25519 trust (FUNC-SPEC §08). Manifest/permission domain types are real; the Wasmtime Component Model host lands in plugin-sandbox-extraction."

[dependencies]
# gen_ui_types / gen_ui_agent (UAR) become dependencies when the Wasmtime host is wired (roadmap M3).
workspace-hack = { path = "../workspace-hack" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Toolchain alignment (plugin-wit-convergence, design D7): wasmtime 46 matches
# the vendored hosts (librefang, UAR `wasm-runtime`); the workspace links a
# single wasmtime major. `.cwasm` caches are pinned to this major.
#
# `async` enables the async Store/instantiate/call path used by the Component
# Model sandbox (plugin-sandbox-extraction, design D3/D5). `runtime` pulls in
# the default host runtime (mmap instances + native signals) required by
# `consume_fuel`/`epoch_interruption`.
wasmtime = { version = "46", features = ["component-model", "async", "runtime"] }
wasmtime-wasi = "46"
# Always-on deny-by-default `WasiHttpCtx` (design D4): JS guest runtimes
# auto-import `wasi:http/types` even when unused; the context must always
# bind with no outbound handler registered.
wasmtime-wasi-http = "46"
async-trait.workspace = true
ed25519-dalek = "2"
sha2.workspace = true
# The async host: per-instance async mutexes and the epoch-interruption
# ticker run on the ambient tokio runtime (design D3/D5 async risk note).
tokio = { workspace = true, features = ["sync", "time", "rt"] }

[dev-dependencies]
# Tokio drives the async invoke path in tests (macros + a runtime + time for
# the wall-clock timeout backstop).
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time", "sync"] }
# Tempdirs for the `.cwasm` cache tests (design D6: cache dir is injected).
tempfile = "3"

[features]
# Reference backend for the HostDispatch seam (design D7). Auto-enabled for
# tests via `#[cfg(any(test, feature = "in-memory-dispatch"))]`; production
# backends arrive with their owning changes and plug into the same trait.
in-memory-dispatch = []
