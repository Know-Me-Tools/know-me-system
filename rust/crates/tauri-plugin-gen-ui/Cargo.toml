[package]
name = "tauri-plugin-gen-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

links = "tauri-plugin-gen-ui"

[dependencies]
gen_ui_types    = { path = "../gen_ui_types" }
gen_ui_runtime  = { path = "../gen_ui_runtime" }
gen_ui_protocol = { path = "../gen_ui_protocol" }
gen_ui_agent    = { path = "../gen_ui_agent" }
gen_ui_host     = { path = "../gen_ui_host" }
gen_ui_db       = { path = "../gen_ui_db", features = ["pglite"] }
gen_ui_db_graph = { path = "../gen_ui_db_graph", features = ["embed-native"] }
gen_ui_audio    = { path = "../gen_ui_audio", optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
once_cell.workspace = true
async-trait.workspace = true
keyring.workspace = true
log = "0.4"
tracing.workspace = true
futures.workspace = true
tauri = { version = "2.11.5", default-features = false }
tokio = { workspace = true, features = ["time"] }
sqlx.workspace = true

# Desktop local-inference engine matrix (per-target features, one codebase):
#   macOS        -> MLX via the in-process mlex (mlx-c) crate (local-mlxc)
#   Windows/Linux -> llama.cpp (local-llama)
# macOS uses MLX to match iOS (Apple's blessed on-device stack); llama.cpp is a
# poor fit on Apple platforms and is off the macOS graph. The pinned/checksummed
# catalog and the shared InferenceProvider seam are identical across both lanes.
[target.'cfg(target_os = "macos")'.dependencies]
gen_ui_inference = { path = "../gen_ui_inference", features = ["local-mlxc"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
gen_ui_inference = { path = "../gen_ui_inference", features = ["local-llama"] }

[features]
default = []
# whisper.cpp and llama.cpp both export GGML globals. Linking both archives into
# one desktop process produces duplicate symbol interposition and an unsafe ABI.
# Scribe remains an explicit build lane until audio is isolated in a framework
# or helper process; normal desktop builds keep the fully functional local LLM.
scribe = ["dep:gen_ui_audio"]

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
serde = { workspace = true }
serde_json = { workspace = true }

[package.metadata.docs.rs]
# Desktop plugin: never built for mobile/wasm targets.
targets = ["x86_64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-pc-windows-msvc"]
