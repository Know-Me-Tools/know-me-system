[toolchain]
# Rust 1.97.1 is the shared native/wasm floor as of 2026-07-19.
# Compatibility with older Rust is not a product constraint.
channel = "1.97.1"
components = ["rustfmt", "clippy", "rust-src"]
targets = [
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "aarch64-linux-android",
    "wasm32-unknown-unknown",
]
