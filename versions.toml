# versions.toml — SINGLE SOURCE OF TRUTH for tool/stack versions and engine
# selections across this skill pack's authority documents (SKILL.md, CLAUDE.md,
# AGENTS.md, README.md, references/*.md).
#
# Rules:
#   - Versions live HERE and only here. Authority docs must state these same
#     values; `bash scripts/audit.sh doc-consistency` fails CI on drift.
#   - When bumping a version: update this file first, then every authority doc,
#     then re-run the audit. (A generated-docs pipeline can replace the manual
#     step later; the audit gate is what prevents rot either way.)
#   - Rationale for non-obvious pins lives next to the value.

[toolchain]
# Latest stable Rust baseline as of 2026-07-19. Compatibility with older Rust
# is not a product constraint; keep this aligned with rust/rust-toolchain.toml.
rust = "1.97.1"
node = "26.5.0"         # Current release as of 2026-07-19; latest phones/tools over LTS conservatism
flutter = "3.47.0-0.1.pre" # latest beta as of 2026-07-19; includes Dart 3.13.0-282.1.beta
typescript = "7.0.2"    # latest stable dist-tag; avoid nightly dev builds in reproducible pins
bun = "1.3.14"
pnpm = "11.15.0"

[frameworks]
tauri_cli = "2.11.4"
flutter_rust_bridge = "2.13.0-beta.5" # latest available FRB line; newer than pub.dev stable 2.12.0; validate before release
riverpod = "3.3.1"              # latest coherent set that compiles today with Freezed: flutter_riverpod 3.3.1, annotation 4.0.2, sqflite 0.4.2, generator 4.0.3; 3.3.2/4.0.4 currently conflict with Freezed's analyzer line
vite = "8.1.5"
react = "19.2.7"
zustand = "5.0.14"
openspec = "1.6.0"              # @fission-ai/openspec — never the squatted bare package

[android_build]
gradle = "9.7.0-rc-1"
android_gradle_plugin = "9.4.0-alpha05"
kotlin_android_plugin = "2.4.20-Beta1"
litert_lm_android = "0.14.0"

[data]
surrealdb = "3.2.1"             # embedded graph/vector/FTS, kv-rocksdb native / kv-indxdb wasm
pglite_oxide = "0.5.1"          # desktop config-DB only (macOS arm64 / Win x64 / Linux x64+arm64)

# Inference engines are per-lane decisions, not one global choice. Android uses
# LiteRT-LM as the universal recovery baseline; llama.cpp remains quarantined
# outside Android production because OpenCL/Adreno proved device-specific.
[inference]
desktop = "llama-cpp-2"         # pinned/checksummed Qwen GGUF; zero-config reference default
android = "LiteRT-LM"           # Gemma 4 E2B .litertlm behind InferenceProvider
ios = "llama-cpp-2"             # retained until iOS Qwen/Metal re-certification
web = "WebLLM"                  # MLC WebGPU lane; zero-key browser default
mistral_optional = "mistral.rs" # experimental desktop alternative behind InferenceProvider
